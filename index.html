<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Gran Incremental</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-left">
        <h1 class="game-title">El Gran Incremental</h1>
      </div>
      <div class="hud-center">
        <div class="currency-display" id="coins-display">
          <span class="currency-icon">&#x1FA99;</span>
          <span class="currency-amount" id="coins-amount">0</span>
          <span class="currency-rate" id="coins-rate">+0/s</span>
        </div>
        <div class="currency-display" id="gems-display">
          <span class="currency-icon">&#x1F48E;</span>
          <span class="currency-amount" id="gems-amount">0</span>
        </div>
      </div>
      <div class="hud-right">
        <span class="prestige-info" id="prestige-info">x1.0</span>
      </div>
    </header>

    <div id="main-layout">
      <nav id="sidebar">
        <button class="nav-btn active" data-tab="upgrades">
          <span class="nav-icon">&#x2B06;&#xFE0F;</span>
          <span class="nav-label">Mejoras</span>
        </button>
        <button class="nav-btn" data-tab="minigames">
          <span class="nav-icon">&#x1F3AE;</span>
          <span class="nav-label">Juegos</span>
        </button>
        <button class="nav-btn" data-tab="prestige">
          <span class="nav-icon">&#x2B50;</span>
          <span class="nav-label">Prestigio</span>
        </button>
        <button class="nav-btn" data-tab="stats">
          <span class="nav-icon">&#x1F4CA;</span>
          <span class="nav-label">Stats</span>
        </button>
      </nav>

      <main id="content-area">
        <div id="tab-upgrades" class="tab-content active"></div>
        <div id="tab-minigames" class="tab-content"></div>
        <div id="tab-prestige" class="tab-content"></div>
        <div id="tab-stats" class="tab-content"></div>
        <div id="minigame-canvas-container" class="hidden"></div>
      </main>
    </div>

    <div id="notifications-container"></div>
    <div id="modal-overlay" class="hidden"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
